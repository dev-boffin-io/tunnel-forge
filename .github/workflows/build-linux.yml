name: Build Linux Binaries

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-linux:
    name: 🐧 Linux Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            suffix: linux-amd64

          - arch: arm64
            runner: ubuntu-24.04-arm
            suffix: linux-arm64

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libgl1 \
            libglib2.0-0 \
            libdbus-1-3

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt6 pyqt6-qt6 pyqt6-sip
          pip install pyyaml psutil colorama
          pip install pyinstaller

      - name: 🔨 Build GUI (tunnel-forge)
        run: |
          pyinstaller \
            --onedir \
            --name "tunnel-forge" \
            --windowed \
            --collect-all PyQt6 \
            --collect-all yaml \
            --hidden-import psutil \
            --hidden-import colorama \
            --add-data "core:core" \
            --add-data "gui:gui" \
            --add-data "utils:utils" \
            --add-data "assets:assets" \
            --add-data "constants.py:." \
            --add-data "cli.py:." \
            main.py

      - name: 🔨 Build CLI (tunnel-forge-cli)
        run: |
          pyinstaller \
            --onedir \
            --name "tunnel-forge-cli" \
            --collect-all yaml \
            --hidden-import psutil \
            --hidden-import colorama \
            --add-data "core:core" \
            --add-data "utils:utils" \
            --add-data "constants.py:." \
            cli.py

      - name: 📦 Tar outputs
        run: |
          tar -czf dist/tunnel-forge-${{ matrix.suffix }}.tar.gz       -C dist tunnel-forge
          tar -czf dist/tunnel-forge-cli-${{ matrix.suffix }}.tar.gz   -C dist tunnel-forge-cli

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-forge-${{ matrix.suffix }}
          path: |
            dist/tunnel-forge-${{ matrix.suffix }}.tar.gz
            dist/tunnel-forge-cli-${{ matrix.suffix }}.tar.gz
          retention-days: 30

  release:
    name: 🚀 GitHub Release
    needs: build-linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: ⬇️ Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: 🏷️ Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
